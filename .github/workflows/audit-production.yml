name: Weekly Production Audit

on:
  schedule:
    # Tous les lundis à 06:00 UTC (ajuste si besoin)
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit production site (Netlify)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run production audit script
        env:
          BASE_URL: https://mb-fretservices.com
        run: npm run audit:site

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: production-audit
          path: audit-report.md
          if-no-files-found: ignore