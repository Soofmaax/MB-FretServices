name: CI - Test, Audit and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid running multiple CI runs in parallel for the same branch/ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test, Typecheck and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Lint
        run: npm run _codelinewn</t

      - name: Unit Tests
        env:
          VITE_SITE_URL: https://mb-fretservices.com
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_SITE_URL: https://mb-fretservices.com
        run: npm run build

      - name: Verify build outputs exist
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt

      - name: Add SPA fallback (GitHub Pages friendly)
        run: cp dist/index.html dist/404.html

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  audit:
    name: Quality Audit (Lighthouse, a11y, links)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Start local server
        run: |
          npx http-server dist -p 8080 --silent &
          echo "Server started at http://localhost:8080"
          sleep 3

      - name: Lighthouse (Home)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/fr
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      - name: Accessibility (pa11y CLI) - 3 key pages
        run: |
          echo "url,type,code,message" > pa11y.csv
          npx --yes pa11y -r csv http://localhost:8080/fr >> pa11y.csv || true
          npx --yes pa11y -r csv http://localhost:8080/fr/services >> pa11y.csv || true
          npx --yes pa11y -r csv http://localhost:8080/fr/contact >> pa11y.csv || true

      - name: Run custom audit script (links, headers, SEO)
        run: node scripts/pr-audit.mjs
        env:
          BASE_URL: http://localhost:8080
          PR_AUDIT_STRICT: "0"

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-audit
          path: |
            pa11y.csv
            audit-report.md
            audit-summary.json
          if-no-files-found: ignore

      - name: Post audit report as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join(process.cwd(), 'audit-report.md');
            const summaryPath = path.join(process.cwd(), 'audit-summary.json');
            const body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'Audit report not found.';
            const summary = fs.existsSync(summaryPath)
              ? JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
              : {};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            if (summary.fail) {
              core.setFailed(summary.reason || 'Quality Gate failed');
            }

  pages_build:
    name: Build site for GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Determine base path (VITE_BASE)
        id: basepath
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [[ "$REPO" == "${OWNER}.github.io" ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build for GitHub Pages
        env:
          VITE_SITE_URL: https://mb-fretservices.com
          VITE_BASE: ${{ steps.basepath.outputs.base }}
        run: npm run build

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages_deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: pages_build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4